$kind: http-request
name: Get Access Token
order: 1000
method: POST
url: '{{base_url}}/v1/oauth2/token'
auth:
  type: basic
  credentials:
    - key: username
      value: '{{client_id}}'
    - key: password
      value: '{{client_secret}}'
body:
  type: urlencoded
  content:
    - key: grant_type
      value: client_credentials
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (json.access_token) {
          pm.environment.set("access_token", json.access_token);
      }
